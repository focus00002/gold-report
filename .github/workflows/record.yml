name: Record purchase

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  record:
    # only the repo owner can record purchases
    if: contains(github.event.issue.labels.*.name, 'purchase') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Save purchase
        id: save
        continue-on-error: true   # bad input: reply to the issue, do not mark the run failed
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/record_purchase.py

      - name: Rebuild report
        if: steps.save.outcome == 'success'
        run: python scripts/update.py

      - name: Commit
        if: steps.save.outcome == 'success'
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data docs
          git commit -m "record purchase (#$ISSUE)"
          git pull --rebase
          git push

      - name: Reply and close
        if: always() && hashFiles('result.md') != ''
        run: |
          gh issue comment "$ISSUE" --body-file result.md
          gh issue close "$ISSUE"
